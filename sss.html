<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Vanilla Site</title>
<style>
  /* Reset & Fonts */
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', sans-serif;}
  body { background: #f0f2f5; color: #333; line-height: 1.6; }

  /* Navbar */
  nav {
    width: 100%;
    padding: 20px 40px;
    background: #111;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav h1 { font-size: 24px; letter-spacing: 1px; }
  nav ul { display: flex; gap: 20px; list-style: none; }
  nav ul li a { color: #fff; text-decoration: none; transition: color 0.3s ease; }
  nav ul li a:hover { color: #1e90ff; }

  /* Hero Section */
  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 90vh;
    background: linear-gradient(to bottom right, #1e90ff, #4facfe);
    color: #fff;
    padding: 0 20px;
  }
  .hero h2 { font-size: 48px; margin-bottom: 20px; opacity:0; transform: translateY(30px); transition: all 0.8s ease; }
  .hero p { font-size: 20px; opacity:0; transform: translateY(30px); transition: all 0.8s ease 0.2s; }
  .hero button {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 18px;
    border:none;
    border-radius:5px;
    background: #fff;
    color: #1e90ff;
    cursor:pointer;
    transition: transform 0.3s ease, background 0.3s ease;
  }
  .hero button:hover { transform: scale(1.1); background: #f0f2f5; }

  /* Features Section */
  .features {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    padding: 80px 40px;
    background:#fff;
  }
  .feature {
    background:#1e90ff;
    color:#fff;
    padding:40px 20px;
    border-radius:10px;
    text-align:center;
    opacity:0;
    transform: translateY(50px);
    transition: all 0.8s ease;
    cursor:pointer;
  }
  .feature:hover { transform: translateY(0) scale(1.05); }

  /* Footer */
  footer {
    text-align:center;
    padding:40px 20px;
    background:#111;
    color:#fff;
  }

  /* Animate visible elements */
  .visible { opacity:1 !important; transform: translateY(0) !important; }
</style>
</head>
<body>

<nav>
  <h1>MySite</h1>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Features</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <h2>Welcome to My Dynamic Site</h2>
  <p>All built with plain HTML, CSS, and JavaScript</p>
  <button>Get Started</button>
</section>

<section class="features">
  <div class="feature">Fast Performance</div>
  <div class="feature">Responsive Design</div>
  <div class="feature">Smooth Animations</div>
  <div class="feature">Easy to Customize</div>
</section>

<footer>
  &copy; 2026 MySite. Built with ❤️ and Vanilla JS.
</footer>

<script>
  // Fade in hero elements
  window.addEventListener('load', ()=>{
    document.querySelectorAll('.hero h2, .hero p').forEach(el => el.classList.add('visible'));
  });

  // Scroll animations for features
  const features = document.querySelectorAll('.feature');
  window.addEventListener('scroll', () => {
    const triggerBottom = window.innerHeight * 0.85;

    features.forEach(feature => {
      const featureTop = feature.getBoundingClientRect().top;
      if(featureTop < triggerBottom){
        feature.classList.add('visible');
      }
    });
  });
</script>

</body>
</html>
