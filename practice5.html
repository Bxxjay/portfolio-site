<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .filter-container{
  display:flex;
  align-items:center;
  position:relative;
  gap:10px;
}

#filterBtn{
  padding:10px 20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
  transition:0.3s;
}

#filterIcon{
  transition: transform 0.3s ease;
}

/* FILTER OPTIONS SLIDE OUT */
.filter-options{
  display:flex;
  gap:10px;
  transform:translateX(-20px);
  opacity:0;
  pointer-events:none;
  transition: all 0.4s ease, width 0.4s ease;
}

.filter-options.open{
  transform:translateX(0);
  opacity:1;
  pointer-events:auto;
}

select{
  padding:8px;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:20px;
  margin-top:20px;
}

.product{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
  transition:0.3s;
}
.product img{
  width:100%;
  height:auto;
}
</style>
<body>
  <div class="filter-container">

  <button id="filterBtn">
    Filter <span id="filterIcon">▼</span>
  </button>

  <div class="filter-options" id="filterOptions">

    <select id="colorFilter">
      <option value="all">Color</option>
      <option value="red">Red</option>
      <option value="black">Black</option>
      <option value="white">White</option>
    </select>

    <select id="sizeFilter">
      <option value="all">Size</option>
      <option value="40">40</option>
      <option value="41">41</option>
      <option value="42">42</option>
    </select>

     <select id="sizeFilter">
      <option value="price">Price</option>
      <option value="40">40</option>
      <option value="41">41</option>
      <option value="42">42</option>
    </select>

  </div>

</div>

<div class="products">

  <div class="product" data-color="red" data-size="41">
    <img src="red-shoe.jpg" alt="Red Sneaker">
    <p>Red Sneaker - Size 41</p>
  </div>

  <div class="product" data-color="black" data-size="42">
    <img src="black-shoe.jpg" alt="Black Sneaker">
    <p>Black Sneaker - Size 42</p>
  </div>

  <div class="product" data-color="white" data-size="40">
    <img src="white-shoe.jpg" alt="White Sneaker">
    <p>White Sneaker - Size 40</p>
  </div>

  <div class="product" data-color="black" data-size="41">
    <img src="black-shoe.jpg" alt="Black Sneaker">
    <p>Black Sneaker - Size 41</p>
  </div>

</div>
<script>
  const filterBtn = document.getElementById("filterBtn");
const filterOptions = document.getElementById("filterOptions");
const filterIcon = document.getElementById("filterIcon");

const colorFilter = document.getElementById("colorFilter");
const sizeFilter = document.getElementById("sizeFilter");
const products = document.querySelectorAll(".product");

// Toggle filter options panel
filterBtn.addEventListener("click", () => {
  filterOptions.classList.toggle("open");
  
  // Rotate icon when open
  if(filterOptions.classList.contains("open")){
    filterIcon.style.transform = "rotate(180deg)";
  }else{
    filterIcon.style.transform = "rotate(0deg)";
  }
});

// Function to filter products
function filterProducts(){
  const color = colorFilter.value;
  const size = sizeFilter.value;

  products.forEach(product => {
    const productColor = product.dataset.color;
    const productSize = product.dataset.size;

    const colorMatch = (color === "all" || productColor === color.toLowerCase());
    const sizeMatch = (size === "all" || productSize === size);

    if(colorMatch && sizeMatch){
      product.style.display = "block";
    }else{
      product.style.display = "none";
    }
  });
}

// Trigger filtering when select changes
colorFilter.addEventListener("change", filterProducts);
sizeFilter.addEventListener("change", filterProducts);
</script>
</body>
</html>
