<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="text" id="taskList">
    <button id="addTask"></button>
    <ul id="taskNote"></ul>
    <button id="clearTask"></button>
    <button id="saveTask"></button>
    <button id="loadTask"></button>
    <script>
        let tasks = [];

        function updateTask(){
            let html = "";
            for(let i = 0;i < tasks.length;i++){
                html += `<li>${tasks[i]}<button onclick="removeTask(${i})">x</button></li>`
            }
            document.getElementById("taskNote").innerHTML= html;
        }

        let addTask = document.getElementById("addTask");

        addTask.addEventListener("click",function() {
            let val = document.getElementById("taskList");
            let text = val.value;
            if (text===""){
                return;
            }
            tasks.push(text);
            text="";                                                                                                                                                                                                                                                                                                                                                                                                       
        })
    </script>
</body>
</html>
